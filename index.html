    function safeGetStorage(key) {
      try {
        return window.localStorage.getItem(key);
      } catch (e) {
        return null;
      }
    }

    function safeSetStorage(key, val) {
      try {
        window.localStorage.setItem(key, val);
      } catch (e) {}
    }

    function getActiveFirebaseConfig() {
      try {
        const saved = safeGetStorage(FB_CONFIG_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.apiKey && parsed.projectId) return parsed;
        }
      } catch (e) {}
      if (
        DEFAULT_FIREBASE_CONFIG.apiKey &&
        !DEFAULT_FIREBASE_CONFIG.apiKey.startsWith("GANTI_DENGAN")
      ) {
        return DEFAULT_FIREBASE_CONFIG;
      }
      return null;
    }

    function initFirestore() {
      const cfg = getActiveFirebaseConfig();
      if (!cfg || !window.firebase || typeof window.firebase.firestore !== "function") return null;
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(cfg);
        }
        return firebase.firestore();
      } catch (err) {
        console.error("Firebase init error:", err);
        return null;
      }
    }

    const STATUS_LIST = [
      "Menunggu Resi",
      "Dalam Pengiriman",
      "Sampai Gudang",
      "Ditimbang",
      "Siap Kirim / Selesai",
      "Retur",
    ];

    const LOCKED_STATUSES = ["Sampai Gudang", "Ditimbang", "Siap Kirim / Selesai"];
    const WEIGHED_OR_PACKED_STATUSES = ["Ditimbang", "Siap Kirim / Selesai"];

    function isReturSubmission(sub) {
      return Boolean(sub && (sub.status === "Retur" || sub.returInfo));
    }

    function canCustomerDeleteSubmission(sub) {
      if (!sub) return false;
      if (!isReturSubmission(sub)) return false;
      if (WEIGHED_OR_PACKED_STATUSES.includes(sub.status)) return false;
      if (sub.sortedChecked) return false;
      return true;
    }

    function createActivityLog({ action, actor, role, targetId, route, resi, customerName, customerCode, detail }) {
      return {
        id: "LOG-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
        timestamp: new Date().toISOString(),
        timeLabel: new Date().toLocaleString("id-ID", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        }),
        action,
        actor,
        role,
        targetId,
        route: route || "",
        resi: resi || "-",
        customerName: customerName || "-",
        customerCode: customerCode || "",
        detail,
      };

    function compressImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxW = 500;
            let w = img.width;
            let h = img.height;
            if (w > maxW) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.55));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function formatAmount(num) {
      return Math.round(Number(num || 0)).toLocaleString("id-ID");
    }

    function getItemPriceValue(item) {
      return Number(item?.totalItemPrice ?? item?.unitPrice ?? 0);
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function computeSubmissionTotal(sub, tripConfig) {
      const cfg = tripConfig[sub.route] || { defaultRate: 180, yuanRate: 2200 };
      const totalGrams = (sub.items || []).reduce((acc, it) => acc + Number(it.weightGram || 0), 0);
      const itemsPriceTotal = (sub.items || []).reduce(
        (acc, it) => acc + getItemPriceValue(it),
        0
      );
      const rate = Number(sub.ratePerGram ?? cfg.defaultRate ?? 180);
      const extra = Number(sub.extraFee || 0);
      const totalIdr = totalGrams * rate + extra;
      if (sub.route === "indo-china" && sub.currency === "CNY") {
        const yRate = Number(cfg.yuanRate || 2200);
        return {
          totalGrams,
          itemsPriceTotal,
          rate,
          extra,
          totalIdr,
          displayTotal: totalIdr / yRate,
          currency: "CNY",
          paid: Number(sub.paidAmount || 0),
          remaining: Math.max(0, totalIdr - Number(sub.paidAmount || 0)),
        };
      }
      return {
        totalGrams,
        itemsPriceTotal,
        rate,
        extra,
        totalIdr,
        displayTotal: totalIdr,
        currency: "IDR",
        paid: Number(sub.paidAmount || 0),
        remaining: Math.max(0, totalIdr - Number(sub.paidAmount || 0)),
      };
    }

    function isNextTrip(sub, tripConfig) {
      if (sub.tripOverride === "ikut trip ini") return false;
      if (sub.tripOverride === "ikut next trip") return true;
      const cfg = tripConfig[sub.route];
      if (!cfg || !cfg.lastReceive) return false;
      const createdDay = (sub.createdAt || "").slice(0, 10);
      return createdDay > cfg.lastReceive;
    }

      function buildDiffSummary(prevSub, nextSub) {
        const changes = [];
        if (prevSub.status !== nextSub.status) {
          changes.push(`Status: ${prevSub.status} → ${nextSub.status}`);
        }
        if ((prevSub.resi || "") !== (nextSub.resi || "")) {
          changes.push(`Resi: ${prevSub.resi || "-"} → ${nextSub.resi || "-"}`);
        }
        if ((prevSub.city || "") !== (nextSub.city || "")) {
          changes.push(`Kota: ${prevSub.city || "-"} → ${nextSub.city || "-"}`);
        }
        if (Boolean(prevSub.sortedChecked) !== Boolean(nextSub.sortedChecked)) {
          changes.push(`Sortir: ${nextSub.sortedChecked ? "Ya" : "Belum"}`);
        }
        if ((prevSub.indoResi || "") !== (nextSub.indoResi || "")) {
          changes.push(`Resi Indo: ${nextSub.indoResi || "-"}`);
        }
        if ((prevSub.tripOverride || "auto") !== (nextSub.tripOverride || "auto")) {
          changes.push(`Kloter: ${nextSub.tripOverride}`);
        }
        if ((prevSub.shortageNote || "") !== (nextSub.shortageNote || "")) {
          changes.push(`Catatan: ${nextSub.shortageNote || "(dihapus)"}`);
        }
        const prevGrams = (prevSub.items || []).reduce((a, b) => a + Number(b.weightGram || 0), 0);
        const nextGrams = (nextSub.items || []).reduce((a, b) => a + Number(b.weightGram || 0), 0);
        if (prevGrams !== nextGrams) {
          changes.push(`Berat: ${prevGrams}g → ${nextGrams}g`);
        }
        const prevPrice = (prevSub.items || []).reduce((a, b) => a + getItemPriceValue(b), 0);
        const nextPrice = (nextSub.items || []).reduce((a, b) => a + getItemPriceValue(b), 0);
        if (prevPrice !== nextPrice) {
          changes.push(`Harga barang: ${formatAmount(prevPrice)} → ${formatAmount(nextPrice)}`);
        }
        if (Number(prevSub.ratePerGram || 0) !== Number(nextSub.ratePerGram || 0)) {
          changes.push(`Tarif/g: ${nextSub.ratePerGram}`);
        }
        if (Number(prevSub.extraFee || 0) !== Number(nextSub.extraFee || 0)) {
          changes.push(`Biaya tambahan: ${nextSub.extraFee}`);
        }
        if (Number(prevSub.paidAmount || 0) !== Number(nextSub.paidAmount || 0)) {
          changes.push(`DP/Dibayar: ${nextSub.paidAmount}`);
        }
        if ((prevSub.paymentStatus || "") !== (nextSub.paymentStatus || "")) {
          changes.push(`Bayar: ${nextSub.paymentStatus}`);
        }
        if (JSON.stringify(prevSub.returInfo) !== JSON.stringify(nextSub.returInfo) && nextSub.returInfo) {
          changes.push(`Retur (${nextSub.returInfo.type})`);
        }
        return changes.length > 0 ? changes.join(" • ") : "Mengubah data/foto kiriman";
      }

      function updateSubmission(subId, updater, actionType = "UBAH", customDetail = "") {
        let updatedObj = null;
        let createdLog = null;
        setDb((prev) => ({
          ...prev,
          submissions: prev.submissions.map((s) => {
            if (s.id !== subId) return s;
            const patch = typeof updater === "function" ? updater(s) : updater;
            const candidate = { ...s, ...patch };
            const summary = customDetail || buildDiffSummary(s, candidate);
            createdLog = createActivityLog({
              action: actionType,
              actor: actorLabel,
              role: session.role,
              targetId: s.id,
              route: s.route,
              resi: candidate.resi,
              customerName: candidate.customerName,
              customerCode: candidate.customerCode,
              detail: summary,
            });
            updatedObj = {
              ...candidate,
              lastAudit: `${summary} oleh ${actorLabel} - ${createdLog.timeLabel}`,
              activityLogs: [createdLog, ...(s.activityLogs || [])],
            };
            return updatedObj;
          }),
        }));
        if (updatedObj) {
          syncSubmissionToCloud(updatedObj);
        }
        if (createdLog) {
          syncActivityLogToCloud(createdLog);
        }
      }

      async function handleStagePhotoDraftSelect(subId, stageKey, filesList) {
        const files = Array.from(filesList || []);
        if (files.length === 0) return;
        const targetSub = db.submissions.find((s) => s.id === subId);
        const existingSaved = targetSub?.photos?.[stageKey] || [];
        const existingDraft = pendingStagePhotos[subId]?.[stageKey] || [];
        const slots = Math.max(0, 5 - existingSaved.length - existingDraft.length);
        const compressed = [];
        for (const f of files.slice(0, slots)) {
          compressed.push(await compressImageFile(f));
        }
        if (compressed.length === 0) return;
        setPendingStagePhotos((prev) => ({
          ...prev,
          [subId]: {
            ...(prev[subId] || {}),
            [stageKey]: [...existingDraft, ...compressed],
          },
        }));
      }

      function handleCancelPendingPhotos(subId) {
        setPendingStagePhotos((prev) => {
          const next = { ...prev };
          delete next[subId];
          return next;
        });
      }

      function handleSavePendingPhotos(subId) {
        const subDraft = pendingStagePhotos[subId];
        if (!subDraft) return;
        const stageLabels = {
          arrival: "Foto Datang",
          scale: "Foto Timbangan",
          indoItem: "Barang di Indo",
          indoPack: "Packing di Indo",
          koperPack: "Foto Packing Koper",
        };
        const addedSummary = [];

        updateSubmission(
          subId,
          (prev) => {
            const nextPhotos = { ...(prev.photos || {}) };
            Object.entries(subDraft).forEach(([stKey, list]) => {
              if (Array.isArray(list) && list.length > 0) {
                nextPhotos[stKey] = [...(nextPhotos[stKey] || []), ...list];
                addedSummary.push(`${stageLabels[stKey] || stKey} (+${list.length})`);
              }
            });
            return { photos: nextPhotos };
          },
          "UBAH",
          addedSummary.length > 0 ? `Simpan foto: ${addedSummary.join(", ")}` : "Simpan foto"
        );

        setPendingStagePhotos((prev) => {
          const next = { ...prev };
          delete next[subId];
          return next;
        });
        setSavedPhotoNoticeSubId(subId);
        setTimeout(() => {
          setSavedPhotoNoticeSubId((cur) => (cur === subId ? "" : cur));
        }, 2200);
      }

      const visibleSubmissions = useMemo(() => {
        if (!route || route === "usa-cargo" || !session) return [];
        let list = db.submissions.filter((s) => s.route === route);

        if (session.role === "customer") {
          list = list.filter((s) => s.customerCode === session.code);
        }

        if (searchResi.trim()) {
          const q = searchResi.trim().toLowerCase();
          list = list.filter(
            (s) =>
              (s.resi || "").toLowerCase().includes(q) ||
              (s.indoResi || "").toLowerCase().includes(q) ||
              (s.customerName || "").toLowerCase().includes(q) ||
              (s.items || []).some((it) => (it.name || "").toLowerCase().includes(q))
          );
        }

        if (filterCategory !== "all") {
          list = list.filter((s) => (s.items || []).some((it) => it.category === filterCategory));
        }

        if (filterStatus !== "all") {
          list = list.filter((s) => s.status === filterStatus);
        }

        if (session.role === "admin") {
          if (route === "china-indo" && filterCity !== "all") {
            list = list.filter((s) => s.city === filterCity);
          }
          if (filterCustomer !== "all") {
            list = list.filter((s) => s.customerName === filterCustomer);
          }
          if (filterUploader !== "all") {
            list = list.filter((s) => s.uploaderName === filterUploader);
          }
        }

        if (tripFilter === "active") {
          list = list.filter((s) => !isNextTrip(s, db.tripConfig));
        } else if (tripFilter === "next") {
          list = list.filter((s) => isNextTrip(s, db.tripConfig));
        }

        const sorted = [...list];
        if (sortBy === "alpha") {
          sorted.sort((a, b) => (a.customerName || "").localeCompare(b.customerName || "", "id"));
        } else if (sortBy === "city") {
          sorted.sort((a, b) => (a.city || "").localeCompare(b.city || "", "id"));
        } else {
          sorted.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        }
        return sorted;

        db.tripConfig,

          if (session.role === "customer" && sub.customerCode !== session.code) continue;

        for (const dl of db.deletedLogs || []) {
          if (dl.route !== route) continue;
          if (session.role === "customer" && dl.customerCode !== session.code) continue;

      const aggregatedBillingByCustomer = useMemo(() => {
        const map = new Map();
        for (const sub of visibleSubmissions) {
          const calc = computeSubmissionTotal(sub, db.tripConfig);
          const key = (sub.customerCode || sub.customerName || sub.id).trim();
          if (!map.has(key)) {
            map.set(key, {
              key,
              customerName: sub.customerName,
              customerCode: sub.customerCode,
              currency: sub.currency || "IDR",
              totalGrams: 0,
              itemsPriceTotal: 0,
              totalIdr: 0,
              paid: 0,
              remaining: 0,
              resiCount: 0,
              subs: [],
            });
          }
          const entry = map.get(key);
          entry.totalGrams += calc.totalGrams;
          entry.itemsPriceTotal += calc.itemsPriceTotal;
          entry.totalIdr += calc.totalIdr;
          entry.paid += calc.paid;
          entry.remaining += calc.remaining;
          if ((sub.resi || "").trim()) entry.resiCount += 1;
          entry.subs.push({ sub, calc });
        }
        return Array.from(map.values());
      }, [visibleSubmissions, db.tripConfig]);

        const triggerPrintOnDoc = (targetWin, cleanupFn) => {
          const doc = targetWin?.document;
          if (!doc) return;
          const imgs = Array.from(doc.images || []);
          const runPrint = () => {
            try {
              targetWin.focus();
              targetWin.print();
            } catch (e) {}
            if (typeof cleanupFn === "function") {
              setTimeout(cleanupFn, 1500);
            }
          };

          if (imgs.length === 0) {
            setTimeout(runPrint, 150);
            return;
          }

          let doneCount = 0;
          const onImgSettled = () => {
            doneCount += 1;
            if (doneCount >= imgs.length) {
              setTimeout(runPrint, 150);
            }
          };

          imgs.forEach((img) => {
            if (img.complete) {
              onImgSettled();
            } else {
              img.addEventListener("load", onImgSettled, { once: true });
              img.addEventListener("error", onImgSettled, { once: true });
            }
          });

          setTimeout(runPrint, 1500);
        };

            win.document.close();

                                <tr className="bg-sun-50/50">
                                  <td colSpan={8} className="p-3 border border-melon-100">
                                    <div className="text-[11px] font-bold text-gray-700 mb-1.5">
                                      Rincian Kiriman {grp.customerName}:
                                    </div>
                                    <div className="space-y-1.5">
                                      {grp.subs.map(({ sub, calc }) => (
                                        <div
                                          key={sub.id}
                                          className="p-2.5 rounded-xl bg-white border border-melon-100 flex flex-wrap items-center justify-between gap-2 text-[11px]"
                                        >
                                          <div>
                                            <strong>Resi: {sub.resi || "(Belum ada resi)"}</strong> • Status: {sub.status} •{" "}
                                            {(sub.items || []).map((i) => `${i.name} x${i.qty}`).join(", ")}
                                          </div>
                                          <div className="flex flex-wrap gap-3">
                                            <span>Berat: <strong>{calc.totalGrams} g</strong></span>
                                            <span>Harga Barang (Info): <strong>{formatAmount(calc.itemsPriceTotal)}</strong></span>
                                            <span className="text-melon-500 font-bold">Tagihan: {fmtAmt(calc.totalIdr)}</span>
                                          </div>
                                        </div>
                                      ))}
                                    </div>
                                  </td>
                                </tr>
                              )}
                            </React.Fragment>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                ) : (
                  <div className="overflow-x-auto sheet-scroll border border-melon-200 rounded-2xl">
                    <table className="min-w-full text-xs border-collapse">
                      <thead>
                        <tr className="bg-melon-100 text-gray-800 font-bold">
                          <th className="p-2.5 border border-melon-200 text-left">Customer / Resi</th>
                          <th className="p-2.5 border border-melon-200 text-left">Berat (g)</th>
                          <th className="p-2.5 border border-melon-200 text-left">{t.itemTotalPrice} (Info)</th>
                          <th className="p-2.5 border border-melon-200 text-left">Tarif/g</th>
                          <th className="p-2.5 border border-melon-200 text-left">Biaya Tambahan</th>
                          {route === "indo-china" && (
                            <th className="p-2.5 border border-melon-200 text-left">Mata Uang</th>
                          )}
                          <th className="p-2.5 border border-melon-200 text-left">Total Tagihan</th>
                          <th className="p-2.5 border border-melon-200 text-left">DP / Dibayar</th>
                          <th className="p-2.5 border border-melon-200 text-left">Sisa &amp; Status Bayar</th>
                        </tr>
                      </thead>
                      <tbody>
                        {visibleSubmissions.map((sub) => {
                          const calc = computeSubmissionTotal(sub, db.tripConfig);
                          const yRate = Number(db.tripConfig["indo-china"]?.yuanRate || 2200);
                          return (
                            <tr key={sub.id} className="odd:bg-white even:bg-melon-50/30">
                              <td className="p-2.5 border border-melon-100">
                                <div className="font-bold">{sub.customerName}</div>
                                <div className="text-[11px] text-gray-500">{sub.resi || "(No Resi)"}</div>
                              </td>
                              <td className="p-2.5 border border-melon-100">
                                {session.role === "admin" ? (
                                  <input
                                    type="number"
                                    value={sub.items?.[0]?.weightGram ?? 0}
                                    onChange={(e) => {
                                      const val = Number(e.target.value || 0);
                                      updateSubmission(sub.id, (prev) => ({
                                        items: (prev.items || []).map((it, idx) =>
                                          idx === 0 ? { ...it, weightGram: val } : it
                                        ),
                                      }));
                                    }}
                                    className="w-20 px-2 py-1 rounded border border-melon-200 bg-white"
                                  />
                                ) : (
                                  `${calc.totalGrams} g`
                                )}
                              </td>
                              <td className="p-2.5 border border-melon-100">
                                {session.role === "admin" ? (
                                  <input
                                    type="number"
                                    min={0}
                                    value={getItemPriceValue(sub.items?.[0])}
                                    onChange={(e) => {
                                      const val = Number(e.target.value || 0);
                                      updateSubmission(sub.id, (prev) => ({
                                        items: (prev.items || []).map((it, idx) =>
                                          idx === 0 ? { ...it, totalItemPrice: val } : it
                                        ),
                                      }));
                                    }}
                                    className="w-24 px-2 py-1 rounded border border-melon-200 bg-white"
                                  />
                                ) : (
                                  formatAmount(calc.itemsPriceTotal)
                                )}
                              </td>
                              <td className="p-2.5 border border-melon-100">
                                {session.role === "admin" ? (
                                  <input
                                    type="number"
                                    value={sub.ratePerGram ?? calc.rate}
                                    onChange={(e) => updateSubmission(sub.id, { ratePerGram: Number(e.target.value || 0) })}
                                    className="w-20 px-2 py-1 rounded border border-melon-200 bg-white"
                                  />
                                ) : (
                                  formatAmount(calc.rate)
                                )}
                              </td>
                              <td className="p-2.5 border border-melon-100">
                                {session.role === "admin" ? (
                                  <input
                                    type="number"
                                    value={sub.extraFee ?? 0}
                                    onChange={(e) => updateSubmission(sub.id, { extraFee: Number(e.target.value || 0) })}
                                    className="w-24 px-2 py-1 rounded border border-melon-200 bg-white"
                                  />
                                ) : (
                                  formatAmount(calc.extra)
                                )}
                              </td>
                              {route === "indo-china" && (
                                <td className="p-2.5 border border-melon-100">
                                  {session.role === "admin" ? (
                                    <select
                                      value={sub.currency || "IDR"}
                                      onChange={(e) => updateSubmission(sub.id, { currency: e.target.value })}
                                      className="px-2 py-1 rounded border border-melon-200 bg-white"
                                    >
                                      <option value="IDR">IDR</option>
                                      <option value="CNY">CNY (Yuan)</option>
                                    </select>
                                  ) : (
                                    sub.currency || "IDR"
                                  )}
                                </td>
                              )}
                              <td className="p-2.5 border border-melon-100 font-bold text-melon-500">
                                {route === "indo-china" && sub.currency === "CNY"
                                  ? (calc.totalIdr / yRate).toFixed(2)
                                  : formatAmount(calc.totalIdr)}
                              </td>
                              <td className="p-2.5 border border-melon-100">
                                {session.role === "admin" ? (
                                  <input
                                    type="number"
                                    value={sub.paidAmount ?? 0}
                                    onChange={(e) => updateSubmission(sub.id, { paidAmount: Number(e.target.value || 0) })}
                                    className="w-24 px-2 py-1 rounded border border-melon-200 bg-white"
                                  />
                                ) : (
                                  formatAmount(calc.paid)
                                )}
                              </td>
                              <td className="p-2.5 border border-melon-100">
                                <div className="font-bold">{formatAmount(calc.remaining)}</div>
                                {session.role === "admin" ? (
                                  <select
                                    value={sub.paymentStatus || "Belum Lunas"}
                                    onChange={(e) => updateSubmission(sub.id, { paymentStatus: e.target.value })}
                                    className="mt-1 px-2 py-0.5 rounded border border-melon-200 bg-white text-[11px]"
                                  >
                                    <option value="Belum Lunas">Belum Lunas</option>
                                    <option value="DP">DP</option>
                                    <option value="Lunas">Lunas</option>
                                  </select>
                                ) : (
                                  <span className="text-[11px] text-gray-600">{sub.paymentStatus}</span>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {activeTab === "logs" && (
              <div className="bg-white/95 border-2 border-melon-200 rounded-3xl p-5 sm:p-7 shadow-lg space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h2 className="font-display text-xl font-bold text-melon-500">{t.activityTitle} ({routeTitle})</h2>
                    <p className="text-xs text-gray-600">
                      Menampilkan siapa yang memasukkan, mengubah, meretur, atau menghapus data beserta waktunya.
                    </p>
                  </div>
                  <span className="text-xs px-3 py-1 rounded-full bg-melon-100 text-melon-500 font-bold">
                    {allActivityLogs.length} Catatan
                  </span>
                </div>

                {allActivityLogs.length === 0 ? (
                  <p className="text-xs text-gray-500 bg-melon-50 p-4 rounded-2xl">Belum ada log aktivitas.</p>
                ) : (
                  <div className="space-y-2.5">
                    {allActivityLogs.map((lg) => (
                      <div
                        key={lg.id}
                        className="p-3.5 rounded-2xl bg-melon-50/50 border border-melon-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs"
                      >
                        <div className="space-y-0.5">
                          <div className="flex flex-wrap items-center gap-1.5">
                            <span className="px-2 py-0.5 rounded-full bg-melon-400 text-white font-bold text-[10px]">
                              {lg.action}
                            </span>
                            <strong className="text-gray-800">{lg.actor}</strong>
                            <span className="text-[11px] text-gray-500">({lg.role})</span>
                            <span className="text-gray-400">•</span>
                            <span className="font-semibold text-gray-700">
                              {lg.customerName} ({lg.targetId})
                            </span>
                            {lg.resi && lg.resi !== "-" && (
                              <span className="text-melon-500 font-semibold">• Resi: {lg.resi}</span>
                            )}
                          </div>
                          <div className="text-gray-700">{lg.detail}</div>
                        </div>
                        <div className="text-[11px] text-gray-500 whitespace-nowrap">{lg.timeLabel}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {activeTab === "trip" && session.role === "admin" && (
              <div className="bg-white/95 border-2 border-melon-200 rounded-3xl p-5 sm:p-7 shadow-lg space-y-4 max-w-xl">
                <h2 className="font-display text-xl font-bold text-melon-500">{t.navTrip} ({routeTitle})</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Tanggal Last Terima</label>
                    <input
                      type="date"
                      value={currentTripCfg.lastReceive || ""}
                      onChange={(e) => {
                        const nextTrip = {
                          ...db.tripConfig,
                          [route]: { ...db.tripConfig[route], lastReceive: e.target.value },
                        };
                        setDb((prev) => ({ ...prev, tripConfig: nextTrip }));
                        syncMetaToCloud(nextTrip, db.customers);
                      }}
                      className="w-full px-3 py-2 rounded-xl border border-melon-200 text-sm bg-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Tanggal Berangkat</label>
                    <input
                      type="date"
                      value={currentTripCfg.departDate || ""}
                      onChange={(e) => {
                        const nextTrip = {
                          ...db.tripConfig,
                          [route]: { ...db.tripConfig[route], departDate: e.target.value },
                        };
                        setDb((prev) => ({ ...prev, tripConfig: nextTrip }));
                        syncMetaToCloud(nextTrip, db.customers);
                      }}
                      className="w-full px-3 py-2 rounded-xl border border-melon-200 text-sm bg-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Tarif Default / gram</label>
                    <input
                      type="number"
                      value={currentTripCfg.defaultRate ?? 180}
                      onChange={(e) => {
                        const nextTrip = {
                          ...db.tripConfig,
                          [route]: { ...db.tripConfig[route], defaultRate: Number(e.target.value || 0) },
                        };
                        setDb((prev) => ({ ...prev, tripConfig: nextTrip }));
                        syncMetaToCloud(nextTrip, db.customers);
                      }}
                      className="w-full px-3 py-2 rounded-xl border border-melon-200 text-sm bg-white"
                    />
                  </div>
                  {route === "indo-china" && (
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">Kurs Yuan (1 CNY = ...)</label>
                      <input
                        type="number"
                        value={currentTripCfg.yuanRate ?? 2200}
                        onChange={(e) => {
                          const nextTrip = {
                            ...db.tripConfig,
                            [route]: { ...db.tripConfig[route], yuanRate: Number(e.target.value || 1) },
                          };
                          setDb((prev) => ({ ...prev, tripConfig: nextTrip }));
                          syncMetaToCloud(nextTrip, db.customers);
                        }}
                        className="w-full px-3 py-2 rounded-xl border border-melon-200 text-sm bg-white"
                      />
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {logModalSubId && modalTargetSub && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-lg w-full border-2 border-melon-200 space-y-4 max-h-[85vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-melon-100 pb-2">
                  <div>
                    <h3 className="font-display text-lg font-bold text-melon-500">{t.activityTitle}</h3>
                    <div className="text-xs text-gray-600">
                      {modalTargetSub.customerName} • {modalTargetSub.id} • Resi: {modalTargetSub.resi || "-"}
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setLogModalSubId(null)}
                    className="px-3 py-1 rounded-xl bg-gray-100 text-xs font-bold cursor-pointer"
                  >
                    Tutup
                  </button>
                </div>

                <div className="space-y-2">
                  {(modalTargetSub.activityLogs || []).map((lg) => (
                    <div key={lg.id} className="p-3 rounded-2xl bg-melon-50/60 border border-melon-100 text-xs space-y-0.5">
                      <div className="flex items-center justify-between gap-2">
                        <div>
                          <span className="font-bold text-melon-500">[{lg.action}]</span>{" "}
                          <strong>{lg.actor}</strong> <span className="text-gray-500">({lg.role})</span>
                        </div>
                        <span className="text-[11px] text-gray-400">{lg.timeLabel}</span>
                      </div>
                      <div className="text-gray-700">{lg.detail}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {changeResiModal && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full border-2 border-melon-200 space-y-4">
                <h3 className="font-display text-lg font-bold text-melon-500">{t.changeResi}</h3>
                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">{t.oldResi}</label>
                  <div className="px-3 py-2 rounded-xl bg-gray-100 text-xs font-semibold">
                    {db.submissions.find((s) => s.id === changeResiModal)?.resi || "(Kosong)"}
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">{t.newResi}</label>
                  <input
                    type="text"
                    value={newResiInput}
                    onChange={(e) => setNewResiInput(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-melon-200 text-sm"
                  />
                </div>
                <div className="flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setChangeResiModal(null)}
                    className="px-4 py-2 rounded-xl bg-gray-100 text-xs font-bold"
                  >
                    Batal
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmChangeResi}
                    className="px-4 py-2 rounded-xl bg-melon-400 text-white text-xs font-bold"
                  >
                    {t.saveResi}
                  </button>
                </div>
              </div>
            </div>
          )}

          {returModal && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full border-2 border-melon-200 space-y-4">
                <h3 className="font-display text-lg font-bold text-melon-500">{t.requestRetur}</h3>
                <div className="flex gap-2">
                  {["Retur CO Ulang", "Retur & Refund"].map((rt) => (
                    <button
                      key={rt}
                      type="button"
                      onClick={() => setReturType(rt)}
                      className={`flex-1 py-2 px-2 rounded-xl text-xs font-bold border ${
                        returType === rt ? "bg-melon-400 text-white border-melon-400" : "bg-white border-melon-200"
                      }`}
                    >
                      {rt}
                    </button>
                  ))}
                </div>
                {returType === "Retur CO Ulang" && (
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">{t.returNewResi}</label>
                    <input
                      type="text"
                      value={returNewResi}
                      onChange={(e) => setReturNewResi(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-melon-200 text-sm"
                    />
                  </div>
                )}
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">{t.returReason}</label>
                  <textarea
                    rows={2}
                    value={returReason}
                    onChange={(e) => setReturReason(e.target.value)}
                    placeholder={returType === "Retur & Refund" ? "Keterangan tidak jadi..." : "Catatan retur..."}
                    className="w-full px-3 py-2 rounded-xl border border-melon-200 text-sm"
                  />
                </div>
                <div className="flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setReturModal(null)}
                    className="px-4 py-2 rounded-xl bg-gray-100 text-xs font-bold"
                  >
                    Batal
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmRetur}
                    className="px-4 py-2 rounded-xl bg-melon-400 text-white text-xs font-bold"
                  >
                    {t.saveRetur}
                  </button>
                </div>
              </div>
            </div>
          )}

          {showSyncModal && session?.role === "admin" && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full border-2 border-melon-200 space-y-4">
                <h3 className="font-display text-lg font-bold text-melon-500">☁️ Sync &amp; Backup</h3>
                <div className="text-xs p-2.5 rounded-xl bg-melon-50 border border-melon-200">
                  Status Firebase: <strong>{cloudStatus.toUpperCase()}</strong>
                  {cloudErrorDetail && <div className="text-red-600 mt-1">{cloudErrorDetail}</div>}
                </div>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={downloadCombinedExcel}
                    className="flex-1 py-2 px-3 rounded-xl bg-rind-100 text-rind-500 text-xs font-bold cursor-pointer"
                  >
                    Download Excel
                  </button>
                  <button
                    type="button"
                    onClick={downloadCombinedPdf}
                    className="flex-1 py-2 px-3 rounded-xl bg-melon-100 text-melon-500 text-xs font-bold cursor-pointer"
                  >
                    Download PDF
                  </button>
                </div>
                <button
                  type="button"
                  onClick={pushLocalDataToCloud}
                  className="w-full py-2 rounded-xl bg-rind-500 text-white text-xs font-bold cursor-pointer"
                >
                  ⬆️ Upload Data Lokal ke Firebase Sekarang
                </button>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Override Firebase Config JSON (Opsional)</label>
                  <textarea
                    rows={4}
                    value={fbConfigText}
                    onChange={(e) => setFbConfigText(e.target.value)}
                    placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'
                    className="w-full px-3 py-2 rounded-xl border border-melon-200 text-xs font-mono"
                  />
                  <button
                    type="button"
                    onClick={saveFirebaseConfig}
                    className="mt-2 w-full py-2 rounded-xl bg-melon-400 text-white text-xs font-bold cursor-pointer"
                  >
                    Simpan Firebase Config
                  </button>
                </div>
                {syncStatusMsg && <p className="text-xs font-semibold text-rind-500">{syncStatusMsg}</p>}
                <button
                  type="button"
                  onClick={() => { setShowSyncModal(false); setSyncStatusMsg(""); }}
                  className="w-full py-2 rounded-xl bg-gray-100 text-gray-700 text-xs font-bold"
                >
                  Tutup
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { error: null };
      }
      static getDerivedStateFromError(error) {
        return { error };
      }
      render() {
        if (this.state.error) {
          return (
            <div style={{ padding: 24, fontFamily: "sans-serif" }}>
              <h2 style={{ color: "#e11d48" }}>Terjadi Error Saat Memuat Aplikasi</h2>
              <pre style={{ whiteSpace: "pre-wrap", background: "#fff1f2", padding: 12, borderRadius: 8 }}>
                {String(this.state.error?.message || this.state.error)}
              </pre>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
